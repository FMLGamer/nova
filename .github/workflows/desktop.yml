name: Apps

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      android-only:
        description: Only build and test Nova for Android
        type: boolean
        default: false

jobs:
  build:
    if: ${{ !inputs.android-only }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows
          - os: macos-latest
            name: macos
          - os: ubuntu-latest
            name: linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install
        run: |
          npm ci
          npm --prefix server ci
          npm --prefix desktop ci

      # Stages the built UI, the compiled server with its dependencies, this Node runtime and ffmpeg,
      # then packages the platform's installers. The publish settings only say where updates are found
      # (latest*.yml); nothing is uploaded from this step.
      - name: Build
        shell: bash
        env:
          DISCORD_CLIENT_ID: ${{ vars.DISCORD_CLIENT_ID }}
        run: |
          npm --prefix desktop run stage
          cd desktop
          npx electron-builder --publish never \
            -c.publish.provider=github \
            -c.publish.owner=${{ github.repository_owner }} \
            -c.publish.repo=${{ github.event.repository.name }}

      - uses: actions/upload-artifact@v4
        with:
          name: nova-${{ matrix.name }}
          path: |
            desktop/release/Nova-*
            desktop/release/latest*.yml
          if-no-files-found: error

  # Nova for Android: the web shell in mobile/ (it opens a Nova server), plus Node.js and the Nova server so it can
  # also run Nova on the phone itself, as a signed APK.
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install
        run: |
          npm ci
          npm --prefix server ci
          npm --prefix mobile ci

      - name: Build the web app and the server
        run: |
          npm run build
          npm --prefix server run build

      - name: Bundle the server and Node.js for the phone
        run: node mobile/scripts/bundle-android.mjs arm64-v8a

      - name: Copy the shell into the Android project
        working-directory: mobile
        run: npx cap sync android

      # Signed with the project's key when the repository has it (secrets NOVA_ANDROID_*); else the debug key.
      - name: Signing key
        env:
          KEYSTORE: ${{ secrets.NOVA_ANDROID_KEYSTORE }}
        run: |
          if [ -n "$KEYSTORE" ]; then
            echo "$KEYSTORE" | base64 -d > "$RUNNER_TEMP/nova.keystore"
            echo "NOVA_KEYSTORE=$RUNNER_TEMP/nova.keystore" >> "$GITHUB_ENV"
          fi

      - name: Build
        working-directory: mobile/android
        env:
          NOVA_KEYSTORE_PASSWORD: ${{ secrets.NOVA_ANDROID_KEYSTORE_PASSWORD }}
          NOVA_KEY_ALIAS: ${{ secrets.NOVA_ANDROID_KEY_ALIAS }}
          NOVA_KEY_PASSWORD: ${{ secrets.NOVA_ANDROID_KEY_PASSWORD }}
        run: |
          VERSION=$(node -p "require('../../package.json').version")
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease -PnovaVersion="$VERSION"
          mkdir -p ../../release-android
          cp app/build/outputs/apk/release/app-release.apk "../../release-android/Nova-$VERSION-android.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: nova-android
          path: release-android/Nova-*.apk
          if-no-files-found: error

  # The phone's own server, for real: an x86_64 test build in an emulator starts it, and the test talks to it.
  android-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install
        run: |
          npm ci
          npm --prefix server ci
          npm --prefix mobile ci

      - name: Build a test app
        run: |
          npm run build
          npm --prefix server run build
          node mobile/scripts/bundle-android.mjs x86_64
          (cd mobile && npx cap sync android)
          (cd mobile/android && chmod +x gradlew && ./gradlew --no-daemon assembleDebug)

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Start Nova in an emulator and use it
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: bash mobile/scripts/android-smoke.sh mobile/android/app/build/outputs/apk/debug/app-debug.apk

  release:
    # Attach whatever built, so one failing platform doesn't hold back the others.
    if: ${{ !cancelled() && startsWith(github.ref, 'refs/tags/') }}
    needs: [build, android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: CHANGELOG.md
          sparse-checkout-cone-mode: false

      # The release text is this version's section of CHANGELOG.md.
      - name: Release notes
        run: |
          v="${GITHUB_REF_NAME#v}"
          awk -v v="$v" '/^## /{p = index($0, "[" v "]") > 0; next} p' CHANGELOG.md > notes.md
          [ -s notes.md ] || echo "See [CHANGELOG.md](CHANGELOG.md)." > notes.md

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Attach to release
        uses: softprops/action-gh-release@v2
        with:
          body_path: notes.md
          files: dist/*
